databases:
  - name: api-anime-db
    databaseName: anime
    user: anime_user
    plan: free
    region: oregon

services:
  - type: web
    name: api-anime-alex
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-anime-db
          property: connectionString
      - key: DB_SSL
        value: "true"
